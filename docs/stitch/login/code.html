        body { font-family: 'Manrope', sans-serif; background-color: #0e0e0e; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary">
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12">
<div class="w-full max-w-md space-y-12">
<header class="text-center space-y-4">
<div class="inline-flex items-center justify-center p-4 bg-surface-container-high rounded-2xl shadow-xl">
<span class="text-[#00e475] font-black tracking-tighter text-4xl font-headline">TB</span>
</div>
<div class="space-y-1">
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface uppercase font-headline">Tracker Broo</h1>
<p class="text-on-surface-variant font-medium tracking-wide label-sm">DISCIPLINE OVER DOPAMINE</p>
</div>
</header>
<div class="bg-surface-container-low p-8 rounded-3xl space-y-8 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
<form class="space-y-6 relative z-10">
<div class="space-y-2">
<label class="block text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Email Adresse</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary transition-all duration-200 outline-none" placeholder="name@beispiel.de" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Passwort</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary transition-all duration-200 outline-none" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end">
<button class="text-[0.6875rem] font-bold uppercase tracking-widest text-primary-dim hover:text-primary transition-colors" type="button">Passwort vergessen?</button>
</div>
</div>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-extrabold py-4 rounded-xl shadow-lg shadow-primary/10 active:scale-[0.98] transition-all duration-150 uppercase tracking-widest text-sm" type="submit">
                        Anmelden
                    </button>
</form>
<div class="relative flex items-center justify-center py-2">
<div class="absolute w-full border-t border-outline-variant/20"></div>
<span class="relative bg-surface-container-low px-4 text-[0.6875rem] font-bold uppercase tracking-widest text-outline">Oder</span>
</div>
<div class="grid grid-cols-2 gap-4 relative z-10">
<button class="flex items-center justify-center space-x-2 bg-surface-container-highest py-4 rounded-xl hover:bg-surface-bright transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-xl" data-icon="google">google</span>
<span class="text-xs font-bold uppercase tracking-widest">Google</span>
</button>
<button class="flex items-center justify-center space-x-2 bg-surface-container-highest py-4 rounded-xl hover:bg-surface-bright transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-xl" data-icon="apple">ios</span>
<span class="text-xs font-bold uppercase tracking-widest">Apple</span>
</button>
</div>
</div>
<footer class="text-center space-y-6">
<p class="text-sm text-on-surface-variant">
                    Noch kein Bro? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Konto erstellen</a>
</p>
<div class="flex items-center justify-center space-x-6 text-[10px] font-bold uppercase tracking-[0.2em] text-outline">
<a class="hover:text-on-surface transition-colors" href="#">Datenschutz</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="hover:text-on-surface transition-colors" href="#">Impressum</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="hover:text-on-surface transition-colors" href="#">Support</a>
</div>
</footer>
</div>
</main>
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute top-[60%] -right-[10%] w-[30%] h-[40%] bg-primary-container/10 blur-[100px] rounded-full"></div>
</div>
