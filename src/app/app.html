<div class="app-surface" [class.keyboard-open]="keyboardOpen()">
  @if (showTopBar()) {
    <app-top-bar></app-top-bar>
  }
  @if (showOfflineBanner()) {
    <p class="offline-banner" role="status" aria-live="polite">Offline-Modus: zuletzt synchronisierte Daten werden angezeigt.</p>
  }
  <section class="route-host">
    <router-outlet></router-outlet>
  </section>
  @if (showInstallBanner()) {
    <aside class="install-banner" aria-live="polite">
      <p class="install-text">Als App installieren für schnelleren Zugriff und Vollbildmodus.</p>
      <div class="install-actions">
        <button mat-flat-button type="button" class="install-btn primary" (click)="installApp()">Installieren</button>
        <button mat-stroked-button type="button" class="install-btn ghost" (click)="dismissInstallBanner()">Später</button>
      </div>
    </aside>
  }
  @if (showNav()) {
    <app-bottom-nav></app-bottom-nav>
  }
</div>
